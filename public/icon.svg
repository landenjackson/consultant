<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Ambient Green Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Center Stylized Sparkle Star -->
  <path d="M 60 16 
           C 60 38, 38 60, 16 60 
           C 38 60, 60 82, 60 104 
           C 60 82, 82 60, 104 60 
           C 82 60, 60 38, 60 16 Z" 
        fill="none" 
        stroke="#22c55e" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Lower-Left Calibration Dot -->
  <circle cx="34" cy="86" r="6" fill="#4ade80" filter="url(#glow)" />

  <!-- Upper-Right Accent Spark / Plus -->
  <path d="M 86 28 L 86 44 M 78 36 L 94 36" 
        stroke="#4ade80" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        filter="url(#glow)" />
</svg>
